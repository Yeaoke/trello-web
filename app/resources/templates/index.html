<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница с кнопкой</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fb;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:focus-visible { outline: 3px solid #818cf8; outline-offset: 4px; }
  </style>
</head>
<body>
  <button type="button" onclick="this.textContent = 'Подтверждено!'">Подтвердить</button>
</body>
</html>
