services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles:
    - cadvisor
    privileged: true
    devices:
    - /dev/kmsg
    command:
    - --docker_only=true
    - --housekeeping_interval=15s
    - --enable_metrics=cpu,memory,network,oom_event
    volumes:
    - /:/rootfs:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /run/containerd:/run/containerd:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/disk/:/dev/disk:ro
    ports:
    - 127.0.0.1:${CADVISOR_PORT:-8088}:8080
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
