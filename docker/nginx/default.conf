server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /metrics.php { return 404; }
    location = /router.php { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
    }
}
server {
    listen 8081;
    root /var/www/html/public;
    location = /stub_status { stub_status; }
    location = /metrics.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/metrics.php;
        fastcgi_pass app:9000;
    }
    location / { return 404; }
}
