services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=1GB
    - --web.enable-lifecycle
    - --web.external-url=http://127.0.0.1:${PROMETHEUS_PORT:-19090}
    volumes:
    - ./docker/prometheus:/etc/prometheus:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-19090}:9090
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --web.external-url=http://127.0.0.1:${ALERTMANAGER_PORT:-19093}
    volumes:
    - ./docker/alertmanager:/etc/alertmanager:ro
    - alertmanager-data:/alertmanager
    ports:
    - 127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9093/-/ready
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '500'
    ports:
    - 127.0.0.1:${MAILPIT_PORT:-18025}:8025
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service/service-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
    - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-13000}:3000
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  nginx-exporter:
    build:
      context: ./docker/nginx-exporter
    command:
    - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9113/metrics
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    environment:
      PHP_FPM_SCRAPE_URI: tcp://app:9000/status
      PHP_FPM_FIX_PROCESS_COUNT: 'true'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9253/metrics
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command:
    - --collector.stat_statements
    - --collector.stat_statements.limit=50
    - --collector.stat_statements.exclude_users=${POSTGRES_EXPORTER_USER:-postgres_exporter}
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-postgres_exporter}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-exporter_dev_password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9187/
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    command:
    - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
    - ./docker/blackbox:/etc/blackbox_exporter:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1:9115/-/healthy
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  app:
    ports: !reset []
    command:
    - php-fpm
    - -F
    environment:
      APP_METRICS_ENABLED: '1'
    volumes:
    - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    - ./docker/php/monitoring.ini:/usr/local/etc/php/conf.d/zz-monitoring.ini:ro
    healthcheck:
      test:
      - CMD-SHELL
      - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind
        -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 3s
      retries: 5
  nginx:
    image: nginx:1.28-alpine
    volumes:
    - ./app:/var/www/html:ro
    - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 127.0.0.1:${APP_PORT:-8090}:80
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://127.0.0.1/nginx-health
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  db:
    command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - pg_stat_statements.track_utility=off
    environment:
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-postgres_exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-exporter_dev_password}
    volumes:
    - ./docker/postgres/monitoring.sh:/docker-entrypoint-initdb.d/02-monitoring.sh:ro
volumes:
  prometheus-data: null
  grafana-data: null
  alertmanager-data: null
